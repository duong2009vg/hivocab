/* FLOATING LIQUID GLASS MOBILE DOCK */

    bottom: 10px !important;
    bottom: max(8px, calc(env(safe-area-inset-bottom, 0px) - 16px)) !important;
    transform: translateX(-50%) !important;
    width: calc(100% - 24px) !important;
    max-width: 420px !important;
    height: 54px !important;
    border-radius: 9999px !important;
    display: flex;
    align-items: center !important;
    justify-content: space-around !important;
    padding: 4px 6px !important;
    z-index: 999 !important;
    backdrop-filter: blur(20px) saturate(180%) contrast(115%) !important;
    -webkit-backdrop-filter: blur(20px) saturate(180%) contrast(115%) !important;

    border: 1px solid rgba(255, 255, 255, 0.55) !important;

/* ==================== AI GENERATE BUTTON (UIVERSE COMPONENT) ==================== */
.btn-wrapper {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 1.5px;
  border-radius: 9999px;
  background: linear-gradient(135deg, #a855f7 0%, #6366f1 50%, #ec4899 100%);
  box-shadow: 0 2px 10px rgba(168, 85, 247, 0.2);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  vertical-align: middle;
}
.btn-wrapper:hover {
  box-shadow: 0 4px 18px rgba(168, 85, 247, 0.4);
  transform: translateY(-1px);
}
.btn-wrapper:active {
  transform: scale(0.98);
}
.btn-wrapper .btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 6px 14px;
  border-radius: 9999px;
  border: none;
  outline: none;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  background: #ffffff;
  color: #1e1b4b;
  transition: background-color 0.25s ease, color 0.25s ease;
  user-select: none;
  overflow: hidden;
  line-height: 1.4;
}
html.dark .btn-wrapper .btn {
  background: #13161a;
  color: #f1f5f9;
}
.btn-wrapper .btn-svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  fill: none;
  stroke: #a855f7;
  stroke-width: 2;
  transition: transform 0.3s ease, filter 0.3s ease;
}
html.dark .btn-wrapper .btn-svg {
  stroke: #c084fc;
}
.btn-wrapper .txt-wrapper {
  position: relative;
  height: 17px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 66px;
}
.btn-wrapper .txt-1 {
  display: flex;
  align-items: center;
  gap: 0.5px;
  transform: translateY(0);
  opacity: 1;
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
}
.btn-wrapper .txt-2 {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5px;
  transform: translateY(115%);
  opacity: 0;
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
  pointer-events: none;
  color: #9333ea;
}
html.dark .btn-wrapper .txt-2 {
  color: #c084fc;
}
.btn-wrapper .btn-letter {
  display: inline-block;
  transition: transform 0.2s ease;
}
.btn-wrapper .btn:hover .txt-1,
.btn-wrapper .btn.is-generating .txt-1,
.btn-wrapper .btn:disabled .txt-1 {
  transform: translateY(-115%);
  opacity: 0;
}
.btn-wrapper .btn:hover .txt-2,
.btn-wrapper .btn.is-generating .txt-2,
.btn-wrapper .btn:disabled .txt-2 {
  transform: translateY(0);
  opacity: 1;
}
.btn-wrapper .btn:hover .btn-svg,
.btn-wrapper .btn.is-generating .btn-svg {
  animation: flicker 1.4s infinite ease-in-out;
}
.btn-wrapper .btn:hover .txt-2 .btn-letter,
.btn-wrapper .btn.is-generating .txt-2 .btn-letter {
  animation: letter-anim 1.2s infinite ease-in-out;
}
.btn-wrapper .txt-2 .btn-letter:nth-child(1) { animation-delay: 0.00s; }
.btn-wrapper .txt-2 .btn-letter:nth-child(2) { animation-delay: 0.08s; }
.btn-wrapper .txt-2 .btn-letter:nth-child(3) { animation-delay: 0.16s; }
.btn-wrapper .txt-2 .btn-letter:nth-child(4) { animation-delay: 0.24s; }
.btn-wrapper .txt-2 .btn-letter:nth-child(5) { animation-delay: 0.32s; }
.btn-wrapper .txt-2 .btn-letter:nth-child(6) { animation-delay: 0.40s; }
.btn-wrapper .txt-2 .btn-letter:nth-child(7) { animation-delay: 0.48s; }
.btn-wrapper .txt-2 .btn-letter:nth-child(8) { animation-delay: 0.56s; }
.btn-wrapper .txt-2 .btn-letter:nth-child(9) { animation-delay: 0.64s; }
.btn-wrapper .txt-2 .btn-letter:nth-child(10) { animation-delay: 0.72s; }

@keyframes letter-anim {
  0%, 100% {
    transform: translateY(0);
    opacity: 0.85;
  }
  50% {
    transform: translateY(-2.5px);
    opacity: 1;
    color: #ec4899;
  }
}
@keyframes flicker {
  0%, 100% {
    opacity: 1;
    transform: rotate(0deg) scale(1);
  }
  50% {
    opacity: 0.8;
    transform: rotate(15deg) scale(1.15);
    filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.75));
  }
}

/* Bulletproof THPT CBT Option Styles */
.opt-btn{
    display:flex;
    align-items:flex-start;
    gap:0.75rem;
    width:100%;
    text-align:left;
    padding:0.65rem 0.9rem;
    border-radius:0.75rem;
    border:1.5px solid #cbd5e1;
    background-color:#ffffff;
    color:#1e293b;
    font-size:0.875rem;
    line-height:1.4;
    cursor:pointer;
    transition:all 0.15s ease-in-out;

    border-width:2px!important;

/* ── HI FLASHCARD 3D FLIP SYSTEM ───────────────────────── */
.flashcard-scene {
    perspective: 1200px;
    -webkit-perspective: 1200px;
    width: 100%;
    max-width: 580px;
    margin-left: auto;
    margin-right: auto;
    display: block;
    position: relative;
    box-sizing: border-box;
}

.flashcard-3d-card {
    position: relative;
    width: 100%;
    min-height: 420px;
    height: 450px;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.65s cubic-bezier(0.34, 1.35, 0.64, 1), box-shadow 0.3s ease;
    border-radius: 1.5rem;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    box-sizing: border-box;
}

@media (max-width: 640px) {
    .flashcard-scene {
        max-width: 100%;
        padding-left: 0.25rem;
        padding-right: 0.25rem;
    }
    .flashcard-3d-card {
        min-height: 380px;
        height: clamp(380px, 60vh, 440px);
        border-radius: 1.25rem;
    }
}

/* Hover elevation (only on desktop/devices with true hover) */
@media (hover: hover) {
    .flashcard-3d-card:not(.is-flipped):hover {
        transform: translateY(-4px);
    }
    .flashcard-3d-card.is-flipped:hover {
        transform: rotateY(180deg) translateY(-4px);
    }
    .flashcard-3d-card:hover .flashcard-sheen {
        opacity: 1;
        animation: flashcardSheen 1.5s ease-in-out infinite;
    }
    .flashcard-3d-card:hover .flashcard-flip-pill {
        transform: scale(1.05);
        box-shadow: 0 4px 16px rgba(0, 97, 146, 0.2);
    }
}

/* Touch active tactile feedback */
.flashcard-3d-card:active {
    transform: scale(0.985);
}
.flashcard-3d-card.is-flipped:active {
    transform: rotateY(180deg) scale(0.985);
}

/* Flipped state */
.flashcard-3d-card.is-flipped {
    transform: rotateY(180deg);
}

/* Faces */
.flashcard-face {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 1.5rem;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 1.5rem 1.25rem;
    overflow: hidden;
    box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.04);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    box-sizing: border-box;
}

@media (min-width: 640px) {
    .flashcard-face {
        padding: 2rem 1.75rem;
    }
}

/* Decorative glass top border sheen */
.flashcard-face::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1.5px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent);
    pointer-events: none;
}

/* FRONT FACE */
.flashcard-front {
    transform: rotateY(0deg);
    z-index: 2;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(112, 120, 129, 0.22);
}

html.dark .flashcard-front {
    background: rgba(30, 41, 59, 0.94);
    border-color: rgba(255, 255, 255, 0.12);
}

.flashcard-front::after {
    content: '';
    position: absolute;
    bottom: -30px;
    right: -30px;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 97, 146, 0.08) 0%, transparent 70%);
    pointer-events: none;
}

/* BACK FACE */
.flashcard-back {
    transform: rotateY(180deg);
    z-index: 1;
    background: linear-gradient(155deg, rgba(255, 255, 255, 0.98) 0%, #f0fdf9 50%, #e0f2fe 100%);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1.5px solid rgba(0, 97, 146, 0.3);
}

html.dark .flashcard-back {
    background: linear-gradient(155deg, #1e293b 0%, #172554 50%, #0c4a6e 100%);
    border-color: rgba(56, 189, 248, 0.3);
}

/* Light reflection sheen */
.flashcard-sheen {
    position: absolute;
    inset: 0;
    border-radius: 1.5rem;
    background: linear-gradient(115deg, transparent 25%, rgba(255, 255, 255, 0.25) 50%, transparent 75%);
    pointer-events: none;
    opacity: 0;
    transform: translateX(-100%);
    transition: opacity 0.3s;
}

@keyframes flashcardSheen {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

.flashcard-flip-pill {
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

<script>
(function() {
    try {
        var h = new Date().getHours();
        var autoTheme = (h >= 0 && h < 4) ? 'ocean' : (h >= 4 && h < 12) ? 'morning' : (h >= 12 && h < 18) ? 'afternoon' : 'night';
        var saved = localStorage.getItem('colour-theme');
        var theme = (saved && ['ocean', 'morning', 'afternoon', 'night'].indexOf(saved) !== -1) ? saved : autoTheme;
        document.documentElement.setAttribute('data-theme', theme);
        var dark = localStorage.getItem('theme');
        if (dark === 'dark' || (!dark && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        // KIỂM TRA PHIÊN ĐĂNG NHẬP NHANH TỪ LOCALSTORAGE ĐỂ CHUYỂN THẲNG VÀO APP
        var hasAuth = false;
        for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf('sb-') === 0 && k.indexOf('-auth-token') !== -1) {
                try {
                    var tokenData = JSON.parse(localStorage.getItem(k) || '{}');
                    if (tokenData && (tokenData.access_token || tokenData.refresh_token || tokenData.user)) {
                        hasAuth = true;
                        break;
                    }
                } catch(_) {}
            }
        }
        var curPath = (window.location.pathname || '').replace(/^\/+/, '').replace(/\/+$/, '');
        var curHash = (window.location.hash || '').replace(/^#/, '').replace(/^page-/, '');
        var isAuthHash = curHash.indexOf('access_token=') !== -1 || curHash.indexOf('error=') !== -1;
        var isDeckRoute = curHash.indexOf('d=') === 0 || curHash.indexOf('deck=') === 0 || curHash.indexOf('topic=') === 0 || curHash.indexOf('library') === 0;
        var isLoginRoute = curHash === 'login' || curPath === 'login';

        if (hasAuth) {
            window._isPreAuthenticated = true;
            document.documentElement.classList.add('user-logged-in');
            var initialRoute = isDeckRoute ? 'library' : ((!curHash || curHash === 'landing' || isLoginRoute || isAuthHash) ? 'dashboard' : curHash.split('?')[0]);
            document.documentElement.setAttribute('data-initial-route', initialRoute);
        } else if (isLoginRoute) {
            document.documentElement.setAttribute('data-initial-route', 'login');
        } else if (isDeckRoute) {
            document.documentElement.setAttribute('data-initial-route', 'library');
        }
    } catch (e) {}
})();
</script>
