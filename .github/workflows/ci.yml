name: HiVocab CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://ci.invalid.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-anon-key
      VITE_TURNSTILE_SITE_KEY: ci-turnstile-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
