<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hi Vocabulary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="popup-header">
      <div class="brand">
        <img src="logo-mark.svg" alt="Hi">
        <div>
          <p>Hi Vocabulary</p>
          <span>Clipper</span>
        </div>
      </div>
      <button id="logoutButton" class="icon-button" type="button" title="Đăng xuất" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </header>

    <!-- Màn hình đăng nhập -->
    <section id="loginCard" class="login-card">
      <div class="login-icon">
        <img src="logo-mark.svg" alt="Hi">
      </div>
      <h2 class="login-title">Đăng nhập để lưu từ</h2>
      <p class="login-desc">Một cửa sổ nhỏ sẽ bật lên. Đăng nhập 1 lần, extension tự hoạt động mãi.</p>
      <button id="googleLoginBtn" class="google-login-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
          <path d="M3.964 10.706A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.038l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Đăng nhập với Google
      </button>
      <p id="loginStatus" class="login-status"></p>
    </section>

    <!-- Màn hình chính -->
    <div id="mainContent" style="display:none">
      <form id="searchForm" class="search-card">
        <label for="termInput">Tra từ nhanh</label>
        <div class="search-row">
          <input id="termInput" autocomplete="off" spellcheck="false" placeholder="Nhập từ hoặc cụm từ tiếng Anh">
          <button id="lookupButton" type="submit">Tra</button>
        </div>
      </form>

      <section id="resultCard" class="result-card is-empty">
        <div class="empty-state">
          <strong>Chọn hoặc nhập từ bất kỳ</strong>
          <span>DeepL dịch nghĩa, Free Dictionary thêm IPA và ví dụ.</span>
        </div>

        <div class="result-body">
          <div class="word-row">
            <div class="word-info">
              <h1 id="wordText"></h1>
              <p id="phoneticText"></p>
            </div>
            <div class="word-actions">
              <button id="audioBtn" class="audio-btn" type="button" title="Nghe phát âm" style="display:none">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                  <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                </svg>
              </button>
              <span id="sourcePill">EN</span>
            </div>
          </div>
          <p id="meaningText" class="meaning"></p>
          <blockquote id="exampleText"></blockquote>
        </div>
      </section>

      <section class="save-card">
        <div class="save-head">
          <div>
            <strong>Lưu vào app</strong>
            <span id="authStatus">Đang tải...</span>
          </div>
        </div>
        <div class="folder-topic-group">
          <div class="selector-field">
            <label for="folderSelect" class="selector-label">Thư mục</label>
            <select id="folderSelect" disabled>
              <option>Đang tải thư mục...</option>
            </select>
          </div>
          <div class="selector-field">
            <label for="topicSelect" class="selector-label">Chủ đề</label>
            <select id="topicSelect" disabled>
              <option>Chọn thư mục trước...</option>
            </select>
          </div>
        </div>
        <button id="saveButton" class="save-button" type="button" disabled>Lưu từ này</button>
        <p id="statusText" class="status-text"></p>
      </section>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
